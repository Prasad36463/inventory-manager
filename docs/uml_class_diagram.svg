<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="960" height="700" fill="#ffffff"/>
<defs><marker id="tri" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L15,7 L0,14 Z" fill="#fff" stroke="#17324D" stroke-width="1.5"/></marker><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L11,6 L0,12" fill="none" stroke="#17324D" stroke-width="1.5"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#17324D">Inventory Manager - UML Class Diagram</text>
<rect x="40" y="50" width="340" height="320" fill="#fff" stroke="#17324D" stroke-width="1.5"/>
<rect x="40" y="50" width="340" height="30" fill="#DCE9F5" stroke="#17324D" stroke-width="1.5"/>
<text x="210.0" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#17324D">Item</text>
<text x="50" y="98" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38"># id : int</text>
<text x="50" y="116" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38"># name : string</text>
<text x="50" y="134" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38"># qty : int</text>
<text x="50" y="152" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38"># price : double</text>
<line x1="40" y1="162" x2="380" y2="162" stroke="#17324D" stroke-width="1.5"/>
<text x="50" y="180" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ Item(i, n, q, p)</text>
<text x="50" y="198" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="italic" fill="#1B2A38">+ virtual ~Item()</text>
<text x="50" y="216" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ getId() : int</text>
<text x="50" y="234" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ getName() : const string&amp;</text>
<text x="50" y="252" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ stockIn(n) : void</text>
<text x="50" y="270" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ stockOut(n) : void</text>
<text x="50" y="288" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ setPrice(p) : void</text>
<text x="50" y="306" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="italic" fill="#1B2A38">+ type() : string  {virtual}</text>
<text x="50" y="324" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="italic" fill="#1B2A38">+ extra() : string  {virtual}</text>
<text x="50" y="342" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ toCSV() : string</text>
<text x="50" y="360" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="italic" fill="#1B2A38">+ show() : void  {virtual}</text>
<rect x="40" y="470" width="340" height="122" fill="#fff" stroke="#17324D" stroke-width="1.5"/>
<rect x="40" y="470" width="340" height="30" fill="#DCE9F5" stroke="#17324D" stroke-width="1.5"/>
<text x="210.0" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#17324D">PerishableItem</text>
<text x="50" y="518" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38">- expiry : string</text>
<line x1="40" y1="528" x2="380" y2="528" stroke="#17324D" stroke-width="1.5"/>
<text x="50" y="546" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ PerishableItem(i,n,q,p,e)</text>
<text x="50" y="564" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ type() : string  {override}</text>
<text x="50" y="582" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ extra() : string  {override}</text>
<rect x="570" y="260" width="350" height="194" fill="#fff" stroke="#17324D" stroke-width="1.5"/>
<rect x="570" y="260" width="350" height="30" fill="#DCE9F5" stroke="#17324D" stroke-width="1.5"/>
<text x="745.0" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#17324D">Inventory</text>
<text x="580" y="308" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38">- items : map&lt;int, unique_ptr&lt;Item&gt;&gt;</text>
<text x="580" y="326" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1B2A38">- file : string</text>
<line x1="570" y1="336" x2="920" y2="336" stroke="#17324D" stroke-width="1.5"/>
<text x="580" y="354" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ load() : void</text>
<text x="580" y="372" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ save() : void</text>
<text x="580" y="390" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ add(item) : void</text>
<text x="580" y="408" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ find(id) : Item&amp;</text>
<text x="580" y="426" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ list() : void</text>
<text x="580" y="444" font-size="12.5" font-family="DejaVu Sans Mono, monospace" font-style="normal" fill="#1B2A38">+ search(key) : void</text>
<rect x="620" y="50" width="250" height="50" fill="#fff" stroke="#17324D" stroke-width="1.5"/>
<rect x="620" y="50" width="250" height="30" fill="#EEF0F2" stroke="#17324D" stroke-width="1.5"/>
<text x="745.0" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#17324D">std::runtime_error</text>
<line x1="620" y1="90" x2="870" y2="90" stroke="#17324D" stroke-width="1.5"/>
<rect x="620" y="150" width="250" height="50" fill="#fff" stroke="#17324D" stroke-width="1.5"/>
<rect x="620" y="150" width="250" height="30" fill="#FBE9CF" stroke="#17324D" stroke-width="1.5"/>
<text x="745.0" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#17324D">InventoryException</text>
<line x1="620" y1="190" x2="870" y2="190" stroke="#17324D" stroke-width="1.5"/>
<line x1="210" y1="470" x2="210" y2="370" stroke="#17324D" stroke-width="1.5" marker-end="url(#tri)"/>
<text x="222" y="424" font-size="11" fill="#5C6B78">inherits</text>
<line x1="745" y1="150" x2="745" y2="100" stroke="#17324D" stroke-width="1.5" marker-end="url(#tri)"/>
<line x1="745" y1="260" x2="745" y2="200" stroke="#17324D" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#open)"/>
<text x="755" y="236" font-size="11" fill="#5C6B78">&lt;&lt;throws&gt;&gt;</text>
<line x1="380" y1="340" x2="545" y2="340" stroke="#17324D" stroke-width="1.5"/>
<polygon points="570,340 557,332 545,340 557,348" fill="#17324D" stroke="#17324D"/>
<text x="386" y="332" font-size="11" fill="#5C6B78">0..*</text>
<text x="470" y="360" text-anchor="middle" font-size="11" fill="#5C6B78">items (owns via unique_ptr)</text>
<text x="40" y="650" font-size="11" fill="#5C6B78">Legend:  hollow triangle = inheritance   |   filled diamond = composition (Inventory owns its Items)   |   dashed arrow = dependency   |   italic = virtual</text>
<text x="40" y="670" font-size="11" fill="#5C6B78"># protected    - private    + public</text>
</svg>